    <!--
      Runs before the bundle so the first paint uses the saved theme.
      A module import would be too late and the page would flash.
      Keep this in sync with src/theme/storage.ts (key "theme").
    -->
    <script>
      (function () {
        var key = 'theme';
        var preference = 'system';
        try {
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (error) {
          /* Storage can throw in private mode. The OS setting still works. */
        }
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-preference', preference);
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
